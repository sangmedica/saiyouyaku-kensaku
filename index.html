<meta charset="UTF-8">
<title>採用薬検索 TMC</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<style>
  :root {
    --bg: #F5F8F6;
    --surface: #FFFFFF;
    --surface-alt: #E7F0EC;
    --ink: #16261F;
    --ink-muted: #5C6E66;
    --accent: #0E7C66;
    --accent-strong: #0B6552;
    --accent-ink: #FFFFFF;
    --line: #DDE7E2;
    --chip-bg: #EAF1EE;
    --chip-ink: #33473F;
    --shadow: 0 -8px 30px rgba(15, 35, 28, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D1512;
      --surface: #16211D;
      --surface-alt: #1C2A24;
      --ink: #EAF3EF;
      --ink-muted: #9AB0A6;
      --accent: #3FD1AE;
      --accent-strong: #59DDBC;
      --accent-ink: #06231C;
      --line: #28352F;
      --chip-bg: #1C2A24;
      --chip-ink: #BFE0D4;
      --shadow: 0 -8px 30px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0D1512;
    --surface: #16211D;
    --surface-alt: #1C2A24;
    --ink: #EAF3EF;
    --ink-muted: #9AB0A6;
    --accent: #3FD1AE;
    --accent-strong: #59DDBC;
    --accent-ink: #06231C;
    --line: #28352F;
    --chip-bg: #1C2A24;
    --chip-ink: #BFE0D4;
    --shadow: 0 -8px 30px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Yu Gothic UI", "Hiragino Sans", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { overflow-x: hidden; }

  .app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    padding: max(14px, env(safe-area-inset-top)) 16px 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-bottom: 1px solid transparent;
  }
  .topbar.scrolled { border-bottom-color: var(--line); }

  .brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .brand .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .brand h1 {
    margin: 2px 0 0;
    font-size: 21px;
    font-weight: 750;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .brand .count {
    font-size: 12px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    padding-top: 4px;
  }

  .search-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    width: 17px;
    height: 17px;
    color: var(--ink-muted);
    pointer-events: none;
  }
  #search {
    width: 100%;
    border: none;
    border-radius: 12px;
    background: var(--surface-alt);
    color: var(--ink);
    font-size: 16px;
    padding: 11px 36px 11px 36px;
    outline: none;
    -webkit-appearance: none;
  }
  #search::placeholder { color: var(--ink-muted); }
  #clearBtn {
    position: absolute;
    right: 8px;
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 50%;
    background: var(--ink-muted);
    color: var(--surface);
    opacity: 0.55;
    font-size: 13px;
    line-height: 22px;
    text-align: center;
    padding: 0;
    display: none;
  }
  #clearBtn.show { display: block; }

  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 16px 12px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: var(--chip-bg);
    color: var(--chip-ink);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 999px;
    white-space: nowrap;
    cursor: pointer;
  }
  .chip .n {
    font-variant-numeric: tabular-nums;
    opacity: 0.65;
    margin-left: 3px;
  }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .chip.active .n { opacity: 0.85; }

  main { flex: 1; padding-bottom: 40px; }

  .section-head {
    position: sticky;
    top: 96px;
    z-index: 10;
    background: var(--surface-alt);
    color: var(--accent-strong);
    font-size: 12.5px;
    font-weight: 750;
    letter-spacing: 0.02em;
    padding: 7px 16px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }

  .row {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .row:active { background: var(--surface-alt); }
  .row .name { font-size: 15.5px; font-weight: 650; }
  .row .kana { font-size: 12px; color: var(--ink-muted); }
  .row .active-ing { font-size: 12.5px; color: var(--ink-muted); }
  .row .indication {
    font-size: 12.5px;
    color: var(--accent-strong);
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .row .group-tag {
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 1px;
  }

  .empty {
    padding: 60px 24px;
    text-align: center;
    color: var(--ink-muted);
    font-size: 14px;
  }

  /* bottom sheet */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(6, 15, 12, 0.42);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
    z-index: 30;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    max-width: 560px;
    margin: 0 auto;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    box-shadow: var(--shadow);
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
    z-index: 31;
    max-height: 84vh;
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet.open { transform: translateY(0); }

  .sheet-handle {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--line);
    margin: 10px auto 4px;
  }

  .sheet-body { overflow-y: auto; padding: 4px 20px 28px; }

  .sheet-tag {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--accent-strong);
    background: var(--surface-alt);
    border-radius: 999px;
    padding: 4px 11px;
    margin-top: 8px;
  }
  .sheet-body h2 {
    font-size: 20px;
    font-weight: 750;
    margin: 12px 0 2px;
    text-wrap: balance;
  }
  .sheet-body .kana {
    font-size: 13px;
    color: var(--ink-muted);
  }

  .field {
    padding: 12px 0;
    border-top: 1px solid var(--line);
  }
  .field:first-of-type { border-top: none; margin-top: 6px; }
  .field .label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .field .value {
    font-size: 15px;
    margin-top: 3px;
    line-height: 1.45;
  }
  .field.indication .value { color: var(--accent-strong); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    .sheet, .backdrop { transition: none; }
  }
</style>

  <header class="topbar" id="topbar">
    <div class="brand">
      <div>

  <div class="sheet-body" id="sheetBody"></div>
</div>

アルHL", "activeIngredient": "", "content": "", "usage": "注射", "origin": "イタリア", "indication": ""}, {"id": 269, "group": "医療機器", "code": "DT05406", "name": "Tonimer lab NOMAL spray 125ml", "nameKana": "トニメールノーマル", "activeIngredient": "Nước biển sâu  Đẳng trương tinh khiết, vô trùng (300mOsm - 0,9%)", "content": "", "usage": "鼻洗浄", "origin": "イタリア", "indication": "鼻腔洗浄（海水系点鼻洗浄液）"}, {"id": 270, "group": "医療機器", "code": "22.NT.0527", "name": "VISMED", "nameKana": "ビスメッド", "activeIngredient": "Natri hyaluronate", "content": "0,3ml", "usage": "Nhỏ hai mắt", "origin": "スイス", "indication": "ドライアイ（点眼）"}, {"id": 271, "group": "医療機器", "code": "DT05486", "name": "Vớ y khoa ĐÙI", "nameKana": "医療用弾性ストッキング大腿", "activeIngredient": "", "content": "", "usage": "外用", "origin": "アメリカ", "indication": ""}, {"id": 272, "group": "医療機器", "code": "CN00099", "name": "Vớ y khoa GỐI", "nameKana": "医療用弾性ストッキング膝", "activeIngredient": "", "content": "", "usage": "外用", "origin": "アメリカ", "indication": ""}, {"id": 273, "group": "化粧品", "code": "CN00029", "name": "Banobagi", "nameKana": "バノバギ", "activeIngredient": "", "content": "", "usage": "外用", "origin": "韓国", "indication": ""}];
const GROUP_ORDER = ["循環器", "消化器", "抗生剤・抗ウイルス剤", "呼吸器・アレルギー", "整形", "産婦人科", "肝臓・腎臓・泌尿器", "神経", "眼科", "抗真菌剤", "外用剤", "サプリメント", "その他", "機能性食品", "医療機器", "化粧品"];

const state = { query: "", activeGroup: null };

const chipsEl = document.getElementById("chips");
const listEl = document.getElementById("list");
const searchEl = document.getElementById("search");
const clearBtn = document.getElementById("clearBtn");
const resultCountEl = document.getElementById("resultCount");
const topbarEl = document.getElementById("topbar");
const backdropEl = document.getElementById("backdrop");
const sheetEl = document.getElementById("sheet");
const sheetBodyEl = document.getElementById("sheetBody");

function normalize(s) {
  return (s || "").toLowerCase();
}

// ひらがな入力でもカタカナ表記の薬品名を検索できるよう、ひらがなをカタカナに変換する
function toKatakana(s) {
  return (s || "").replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
}

function groupCounts() {
  const counts = {};
  for (const d of DRUGS) counts[d.group] = (counts[d.group] || 0) + 1;
  return counts;
}

function renderChips() {
  const counts = groupCounts();
  const frag = document.createDocumentFragment();

  const allChip = document.createElement("button");
  allChip.className = "chip" + (state.activeGroup === null ? " active" : "");
  allChip.innerHTML = `すべて <span class="n">${DRUGS.length}</span>`;
  allChip.onclick = () => { state.activeGroup = null; renderChips(); renderList(); };
  frag.appendChild(allChip);

  for (const g of GROUP_ORDER) {
    if (!counts[g]) continue;
    const chip = document.createElement("button");
    chip.className = "chip" + (state.activeGroup === g ? " active" : "");
    chip.innerHTML = `${g} <span class="n">${counts[g]}</span>`;
    chip.onclick = () => { state.activeGroup = (state.activeGroup === g ? null : g); renderChips(); renderList(); };
    frag.appendChild(chip);
  }
  chipsEl.innerHTML = "";
  chipsEl.appendChild(frag);
}

function matchesQuery(d, q, qKana) {
  if (!q) return true;
  return normalize(d.name).includes(q) ||
    normalize(d.nameKana).includes(qKana) ||
    normalize(d.activeIngredient).includes(q) ||
    normalize(d.indication).includes(q);
}

function filteredDrugs() {
  const q = normalize(state.query.trim());
  const qKana = normalize(toKatakana(state.query.trim()));
  return DRUGS.filter(d => (state.activeGroup === null || d.group === state.activeGroup) && matchesQuery(d, q, qKana));
}

function rowHtml(d) {
  return `<div class="row" data-id="${d.id}">
    <div class="name">${escapeHtml(d.name)}</div>
    ${d.nameKana ? `<div class="kana">${escapeHtml(d.nameKana)}</div>` : ""}
    ${d.activeIngredient ? `<div class="active-ing">${escapeHtml(d.activeIngredient)}</div>` : ""}
    ${d.indication ? `<div class="indication">${escapeHtml(d.indication)}</div>` : ""}
    ${state.activeGroup === null ? `<div class="group-tag">${escapeHtml(d.group)}</div>` : ""}
  </div>`;
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function renderList() {
  const results = filteredDrugs();
  const q = state.query.trim();

  if (results.length === 0) {
    listEl.innerHTML = `<div class="empty">該当する薬剤が見つかりません。</div>`;
    resultCountEl.textContent = "";
    return;
  }

  if (q || state.activeGroup !== null) {
    resultCountEl.textContent = `${results.length}件`;
  } else {
    resultCountEl.textContent = `${DRUGS.length}件の薬剤`;
  }

  if (q) {
    // 検索中はグループ分けせずフラットに表示
    listEl.innerHTML = results.map(rowHtml).join("");
  } else {
    const byGroup = {};
    for (const d of results) (byGroup[d.group] = byGroup[d.group] || []).push(d);
    const order = state.activeGroup ? [state.activeGroup] : GROUP_ORDER;
    let html = "";
    for (const g of order) {
      const items = byGroup[g];
      if (!items || !items.length) continue;
      html += `<div class="section-head">${escapeHtml(g)}(${items.length})</div>`;
      html += items.map(rowHtml).join("");
    }
    listEl.innerHTML = html;
  }

  listEl.querySelectorAll(".row").forEach(el => {
    el.addEventListener("click", () => openSheet(Number(el.dataset.id)));
  });
}

function fieldHtml(label, value, extraClass) {
  if (!value) return "";
  return `<div class="field ${extraClass || ""}">
    <div class="label">${label}</div>
    <div class="value">${escapeHtml(value)}</div>
  </div>`;
}

function openSheet(id) {
  const d = DRUGS.find(x => x.id === id);
  if (!d) return;
  sheetBodyEl.innerHTML = `
    <div class="sheet-tag">${escapeHtml(d.group)}</div>
    <h2>${escapeHtml(d.name)}</h2>
    ${d.nameKana ? `<div class="kana">${escapeHtml(d.nameKana)}</div>` : ""}
    ${fieldHtml("適応疾患", d.indication, "indication")}
    ${fieldHtml("有効成分", d.activeIngredient)}
    ${fieldHtml("含有量", d.content)}
    ${fieldHtml("使用方法", d.usage)}
    ${fieldHtml("原産国", d.origin)}
    ${fieldHtml("薬品コード", d.code)}
  `;
  backdropEl.classList.add("open");
  sheetEl.classList.add("open");
}

function closeSheet() {
  backdropEl.classList.remove("open");
  sheetEl.classList.remove("open");
}

backdropEl.addEventListener("click", closeSheet);

searchEl.addEventListener("input", () => {
  state.query = searchEl.value;
  clearBtn.classList.toggle("show", state.query.length > 0);
  renderList();
});
clearBtn.addEventListener("click", () => {
  searchEl.value = "";
  state.query = "";
  clearBtn.classList.remove("show");
  searchEl.focus();
  renderList();
});

window.addEventListener("scroll", () => {
  topbarEl.classList.toggle("scrolled", window.scrollY > 2);
}, { passive: true });

renderChips();
renderList();
</script>
